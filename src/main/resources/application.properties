spring.application.name=qlic-backend-api

# Default profile for local development (in-memory H2). In the cloud: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev
server.port=${PORT:8080}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# Security - JWT (HS256). In production set the JWT_SECRET environment variable (at least 32 characters)
qlic.security.jwt.secret=${JWT_SECRET:qlic-dev-secret-key-change-me-in-production-2026}
qlic.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# i18n: English (en_US) by default, Latin American Spanish (es_419) via Accept-Language
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# OpenAPI documentation / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

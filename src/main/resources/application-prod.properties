# Production: managed PostgreSQL on Render. SPRING_DATASOURCE_URL can be set directly; otherwise the
# JDBC URL is built from DB_HOST, DB_PORT and DB_NAME, which the Render Blueprint (render.yaml) injects.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# The free PostgreSQL instance accepts few connections
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.h2.console.enabled=false
spring.jpa.show-sql=false
